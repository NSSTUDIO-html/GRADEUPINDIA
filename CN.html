<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Computer Networks Skills</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <style>
    body {
      background: radial-gradient(circle at top, #020617, #0f172a);
    }
  </style>
</head>

<body class="text-white font-sans">

  <!-- HEADER -->
  <div class="text-center py-10">
    <h1 class="text-4xl font-bold">🌐 Computer Networks</h1>
    <p class="text-gray-400 mt-2">Connectivity, Protocols & Network Systems</p>
    <div class="w-40 h-1 bg-cyan-400 mx-auto mt-3 rounded-full"></div>
  </div>

  <!-- GRID -->
  <div class="max-w-6xl mx-auto px-4">

    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6">

      <div class="skill bg-blue-500">
        <span>TCP/IP</span>
      </div>

      <div class="skill bg-cyan-500 text-black">
        <span>OSI Model</span>
      </div>

      <div class="skill bg-indigo-500">
        <span>Routing</span>
      </div>

      <div class="skill bg-green-500 text-black">
        <span>Switching</span>
      </div>

      <div class="skill bg-purple-500">
        <span>DNS</span>
      </div>

      <div class="skill bg-pink-500">
        <span>HTTP/HTTPS</span>
      </div>

      <div class="skill bg-yellow-500 text-black">
        <span>FTP</span>
      </div>

      <div class="skill bg-blue-700">
        <span>Network Security</span>
      </div>

      <div class="skill bg-green-700">
        <span>Firewalls</span>
      </div>

      <div class="skill bg-gray-700">
        <span>VPN</span>
      </div>

      <div class="skill bg-indigo-700">
        <span>Load Balancing</span>
      </div>

      <div class="skill bg-cyan-400 text-black">
        <span>Cloud Networking</span>
      </div>

      <div class="skill bg-blue-600">
        <span>LAN/WAN</span>
      </div>

      <div class="skill bg-purple-700">
        <span>Wireless Networks</span>
      </div>

      <div class="skill bg-orange-500">
        <span>Network Troubleshooting</span>
      </div>

    </div>
  </div>

  <!-- STYLE -->
  <style>
    .skill {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      border-radius: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 20px rgba(34, 211, 238, 0.15);
    }

    .skill i {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .skill:hover {
      transform: translateY(-10px) scale(1.07);
      box-shadow: 0 0 35px rgba(34, 211, 238, 0.9);
    }
  </style>

</body>
</html>
