<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cybersecurity Skills</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <style>
    body {
      background: radial-gradient(circle at top, #000000, #020617);
    }
  </style>
</head>

<body class="text-green-400 font-mono">

  <!-- HEADER -->
  <div class="text-center py-10">
    <h1 class="text-4xl font-bold text-green-400">🛡️ Cybersecurity</h1>
    <p class="text-green-300 mt-2">Security, Ethical Hacking & Protection</p>
    <div class="w-40 h-1 bg-green-500 mx-auto mt-3 rounded-full"></div>
  </div>

  <!-- GRID -->
  <div class="max-w-6xl mx-auto px-4">

    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6">

      <div class="skill bg-green-700">
        <i class="fas fa-user-secret"></i>
        <span>Ethical Hacking</span>
      </div>

      <div class="skill bg-green-600">
        <span>Penetration Testing</span>
      </div>

      <div class="skill bg-green-800">
        <span>Network Security</span>
      </div>

      <div class="skill bg-green-500 text-black">
        <span>Cryptography</span>
      </div>

      <div class="skill bg-green-900">
        <span>Web Security</span>
      </div>

      <div class="skill bg-green-700">
        <span>OWASP</span>
      </div>

      <div class="skill bg-green-600">
        <span>Malware Analysis</span>
      </div>

      <div class="skill bg-green-800">
        <span>Digital Forensics</span>
      </div>

      <div class="skill bg-green-500 text-black">
        <span>Linux Security</span>
      </div>

      <div class="skill bg-green-900">
        <span>Firewalls</span>
      </div>

      <div class="skill bg-green-700">
        <span>VPN</span>
      </div>

      <div class="skill bg-green-600">
        <span>IDS/IPS</span>
      </div>

      <div class="skill bg-green-800">
        <span>Security Auditing</span>
      </div>

      <div class="skill bg-green-500 text-black">
        <span>Bug Bounty</span>
      </div>

      <div class="skill bg-green-900">
        <span>SIEM</span>
      </div>

    </div>
  </div>

  <!-- STYLE -->
  <style>
    .skill {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      border-radius: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 20px rgba(34, 197, 94, 0.15);
    }

    .skill i {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .skill:hover {
      transform: translateY(-10px) scale(1.07);
      box-shadow: 0 0 35px rgba(34, 197, 94, 0.9);
    }
  </style>

</body>
</html>
