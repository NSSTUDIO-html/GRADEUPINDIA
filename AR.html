<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR VR Skills</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <style>
    body {
      background: radial-gradient(circle at top, #020617, #0f172a);
    }
  </style>
</head>

<body class="text-white font-sans">

  <!-- HEADER -->
  <div class="text-center py-10">
    <h1 class="text-4xl font-bold">🥽 AR / VR Development</h1>
    <p class="text-gray-400 mt-2">Augmented & Virtual Reality Experiences</p>
    <div class="w-40 h-1 bg-cyan-400 mx-auto mt-3 rounded-full"></div>
  </div>

  <!-- GRID -->
  <div class="max-w-6xl mx-auto px-4">

    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6">

      <div class="skill bg-purple-600">
        <span>Unity AR/VR</span>
      </div>

      <div class="skill bg-indigo-600">
        <span>Unreal VR</span>
      </div>

      <div class="skill bg-green-500 text-black">
        <span>ARCore</span>
      </div>

      <div class="skill bg-blue-500">
        <span>ARKit</span>
      </div>

      <div class="skill bg-cyan-500 text-black">
        <span>WebXR</span>
      </div>

      <div class="skill bg-pink-500">
        <span>3D Modeling</span>
      </div>

      <div class="skill bg-yellow-500 text-black">
        <span>Blender</span>
      </div>

      <div class="skill bg-red-500">
        <span>VR Interaction</span>
      </div>

      <div class="skill bg-indigo-500">
        <span>Spatial Design</span>
      </div>

      <div class="skill bg-orange-500">
        <span>XR SDK</span>
      </div>

      <div class="skill bg-gray-700">
        <span>Shaders</span>
      </div>

      <div class="skill bg-green-600">
        <span>3D Animation</span>
      </div>

      <div class="skill bg-blue-700">
        <span>Mixed Reality</span>
      </div>

      <div class="skill bg-purple-700">
        <span>VR UI/UX</span>
      </div>

      <div class="skill bg-cyan-400 text-black">
        <span>Simulation</span>
      </div>

    </div>
  </div>

  <!-- STYLE -->
  <style>
    .skill {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      border-radius: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 20px rgba(34, 211, 238, 0.15);
    }

    .skill i {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .skill:hover {
      transform: translateY(-10px) scale(1.07);
      box-shadow: 0 0 35px rgba(34, 211, 238, 0.9);
    }
  </style>

</body>
</html>
