<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Development Skills</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <style>
    body {
      background: radial-gradient(circle at top, #020617, #0f172a);
    }
  </style>
</head>

<body class="text-white font-sans">

  <!-- HEADER -->
  <div class="text-center py-10">
    <h1 class="text-4xl font-bold">📱 App Development Skills</h1>
    <p class="text-gray-400 mt-2">Mobile & Cross-Platform Technologies</p>
    <div class="w-40 h-1 bg-pink-500 mx-auto mt-3 rounded-full"></div>
  </div>

  <!-- GRID -->
  <div class="max-w-6xl mx-auto px-4">

    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6">

      <!-- ANDROID -->
      <div class="skill bg-green-600">
        <i class="fab fa-android"></i>
        <span>Android</span>
      </div>

      <!-- JAVA -->
      <div class="skill bg-red-600">
        <i class="fab fa-java"></i>
        <span>Java</span>
      </div>

      <!-- KOTLIN -->
      <div class="skill bg-purple-600">
        <span>Kotlin</span>
      </div>

      <!-- FLUTTER -->
      <div class="skill bg-sky-400 text-black">
        <span>Flutter</span>
      </div>

      <!-- DART -->
      <div class="skill bg-blue-500">
        <span>Dart</span>
      </div>

      <!-- REACT NATIVE -->
      <div class="skill bg-cyan-400 text-black">
        <i class="fab fa-react"></i>
        <span>React Native</span>
      </div>

      <!-- SWIFT -->
      <div class="skill bg-orange-500">
        <span>Swift</span>
      </div>

      <!-- IOS -->
      <div class="skill bg-gray-300 text-black">
        <i class="fab fa-apple"></i>
        <span>iOS</span>
      </div>

      <!-- FIREBASE -->
      <div class="skill bg-yellow-400 text-black">
        <span>Firebase</span>
      </div>

      <!-- API -->
      <div class="skill bg-indigo-500">
        <span>REST API</span>
      </div>

      <!-- SQLITE -->
      <div class="skill bg-blue-700">
        <span>SQLite</span>
      </div>

      <!-- UI/UX -->
      <div class="skill bg-pink-500">
        <span>UI/UX</span>
      </div>

      <!-- GIT -->
      <div class="skill bg-orange-600">
        <i class="fab fa-git-alt"></i>
        <span>Git</span>
      </div>

      <!-- PLAY STORE -->
      <div class="skill bg-green-500 text-black">
        <span>Play Store</span>
      </div>

      <!-- APP STORE -->
      <div class="skill bg-gray-500">
        <span>App Store</span>
      </div>

    </div>
  </div>

  <!-- STYLE -->
  <style>
    .skill {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      border-radius: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 20px rgba(255, 0, 150, 0.15);
    }

    .skill i {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .skill:hover {
      transform: translateY(-10px) scale(1.07);
      box-shadow: 0 0 30px rgba(255, 0, 150, 0.7);
    }
  </style>

</body>
</html>
