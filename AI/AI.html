<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI & ML Skills</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <style>
    body {
      background: radial-gradient(circle at top, #020617, #0f172a);
    }
  </style>
</head>

<body class="text-white font-sans">

  <!-- HEADER -->
  <div class="text-center py-10">
    <h1 class="text-4xl font-bold">🤖 AI & Machine Learning</h1>
    <p class="text-gray-400 mt-2">Smart Systems & Intelligent Models</p>
    <div class="w-40 h-1 bg-purple-500 mx-auto mt-3 rounded-full"></div>
  </div>

  <!-- GRID -->
  <div class="max-w-6xl mx-auto px-4">

    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6">

      <div class="skill bg-yellow-500 text-black">
        <i class="fab fa-python"></i>
        <span>Python</span>
      </div>

      <div class="skill bg-orange-500">
        <span>NumPy</span>
      </div>

      <div class="skill bg-blue-500">
        <span>Pandas</span>
      </div>

      <div class="skill bg-green-500 text-black">
        <span>Scikit-learn</span>
      </div>

      <div class="skill bg-red-500">
        <span>TensorFlow</span>
      </div>

      <div class="skill bg-orange-600">
        <span>PyTorch</span>
      </div>

      <div class="skill bg-purple-600">
        <span>Deep Learning</span>
      </div>

      <div class="skill bg-indigo-500">
        <span>Machine Learning</span>
      </div>

      <div class="skill bg-pink-500">
        <span>Computer Vision</span>
      </div>

      <div class="skill bg-cyan-400 text-black">
        <span>NLP</span>
      </div>

      <div class="skill bg-gray-600">
        <span>Data Preprocessing</span>
      </div>

      <div class="skill bg-green-700">
        <span>Model Training</span>
      </div>

      <div class="skill bg-blue-700">
        <span>Model Deployment</span>
      </div>

      <div class="skill bg-yellow-400 text-black">
        <span>OpenCV</span>
      </div>

      <div class="skill bg-indigo-700">
        <span>AI APIs</span>
      </div>

    </div>
  </div>

  <!-- STYLE -->
  <style>
    .skill {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      border-radius: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.15);
    }

    .skill i {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .skill:hover {
      transform: translateY(-10px) scale(1.07);
      box-shadow: 0 0 30px rgba(168, 85, 247, 0.8);
    }
  </style>

</body>
</html>
