<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud Computing Skills</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <style>
    body {
      background: radial-gradient(circle at top, #020617, #0f172a);
    }
  </style>
</head>

<body class="text-white font-sans">

  <!-- HEADER -->
  <div class="text-center py-10">
    <h1 class="text-4xl font-bold">☁️ Cloud Computing</h1>
    <p class="text-gray-400 mt-2">Scalable Infrastructure & Deployment</p>
    <div class="w-40 h-1 bg-sky-400 mx-auto mt-3 rounded-full"></div>
  </div>

  <!-- GRID -->
  <div class="max-w-6xl mx-auto px-4">

    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6">

      <div class="skill bg-orange-500">
        <i class="fab fa-aws"></i>
        <span>AWS</span>
      </div>

      <div class="skill bg-blue-500">
        <i class="fab fa-google"></i>
        <span>GCP</span>
      </div>

      <div class="skill bg-indigo-600">
        <i class="fab fa-microsoft"></i>
        <span>Azure</span>
      </div>

      <div class="skill bg-yellow-500 text-black">
        <span>Firebase</span>
      </div>

      <div class="skill bg-gray-700">
        <span>Cloud Storage</span>
      </div>

      <div class="skill bg-green-600">
        <span>Docker</span>
      </div>

      <div class="skill bg-blue-700">
        <span>Kubernetes</span>
      </div>

      <div class="skill bg-purple-600">
        <span>Serverless</span>
      </div>

      <div class="skill bg-cyan-500 text-black">
        <span>CI/CD</span>
      </div>

      <div class="skill bg-indigo-500">
        <span>DevOps</span>
      </div>

      <div class="skill bg-pink-500">
        <span>Load Balancing</span>
      </div>

      <div class="skill bg-green-700">
        <span>Linux</span>
      </div>

      <div class="skill bg-gray-500">
        <span>Networking</span>
      </div>

      <div class="skill bg-blue-400 text-black">
        <span>Vercel</span>
      </div>

      <div class="skill bg-orange-600">
        <span>Netlify</span>
      </div>

    </div>
  </div>

  <!-- STYLE -->
  <style>
    .skill {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      border-radius: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.15);
    }

    .skill i {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .skill:hover {
      transform: translateY(-10px) scale(1.07);
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.8);
    }
  </style>

</body>
</html>
